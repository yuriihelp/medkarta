version: "3.9"

# Production compose
# Usage: bash deploy/deploy.sh
# Or manually: docker compose -f docker-compose.prod.yml up -d

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-puls}
      POSTGRES_USER: ${POSTGRES_USER:-puls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puls}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puls} -d ${POSTGRES_DB:-puls}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-puls}:${POSTGRES_PASSWORD:-puls}@postgres:5432/${POSTGRES_DB:-puls}
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Not exposed publicly — nginx proxies /api → backend:8000

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80"    # Frontend: http://SERVER_IP:3000
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
